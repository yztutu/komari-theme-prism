<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komari Monitor</title>
<style>
  :root{
    --txt:#eef3f9; --dim:#a7b3c6; --faint:#7c879c;
    --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.085);
    --edge:rgba(255,255,255,.11); --edge2:rgba(255,255,255,.18);
    --acc:#4cc9ff; --teal:#2fe6b4; --amber:#ffbe50; --red:#ff6b6b;
    --r:20px; --shadow:0 18px 50px rgba(2,6,18,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--txt); background:#0a0d1a; overflow-x:hidden;
  }
  body::before{content:"";position:fixed;inset:0;z-index:-2;background:
    radial-gradient(720px 420px at 12% -6%, rgba(56,150,200,.34), transparent 62%),
    radial-gradient(820px 520px at 96% 108%, rgba(112,64,190,.32), transparent 62%),
    radial-gradient(560px 360px at 58% 30%, rgba(30,110,140,.16), transparent 65%),
    linear-gradient(180deg,#0a0e1e 0%,#0a0d1a 55%,#0c0a1c 100%);}
  body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.16) .6px, transparent .7px);background-size:130px 130px;
    mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 42%);}
  .wrap{max-width:1240px;margin:0 auto;padding:30px 22px 46px}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .title{display:flex;align-items:baseline;gap:12px}
  .title h1{font-size:25px;font-weight:700;letter-spacing:.02em}
  .title span{color:var(--dim);font-size:13px;letter-spacing:.08em}
  .live{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;
    background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    font-size:13px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
  .dot.bad{background:var(--red);box-shadow:0 0 10px var(--red)}
  .glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.07)}
  .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
  .ov{padding:16px 20px}
  .ov .k{font-size:12px;color:var(--faint);letter-spacing:.14em}
  .ov .v{font-size:25px;font-weight:700;margin-top:5px;display:inline-block}
  .ov .s{color:var(--dim);font-size:12px;margin-left:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(352px,1fr));gap:16px;margin-top:18px}
  .card{padding:20px 22px 16px;transition:transform .25s ease,border-color .25s ease,background .25s ease}
  .card:hover{transform:translateY(-3px);border-color:var(--edge2);background:var(--glass2)}
  .card .top{display:flex;align-items:center;gap:10px}
  .cc{font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:8px;
    background:rgba(255,255,255,.09);border:1px solid var(--edge)}
  .name{font-size:17px;font-weight:650}
  .sdot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 9px var(--teal)}
  .sdot.off{background:var(--red);box-shadow:0 0 9px var(--red)}
  .sub{color:var(--dim);font-size:12.5px;margin-top:7px}
  .tag{margin-left:auto;font-size:11px;color:var(--acc);padding:4px 10px;border-radius:999px;
    border:1px solid rgba(76,201,255,.4);background:rgba(76,201,255,.09)}
  .row2{display:flex;align-items:center;margin-top:6px}
  .meters{margin-top:15px;display:grid;gap:11px}
  .m{display:grid;grid-template-columns:38px 44px 1fr;align-items:center;gap:9px;font-size:12.5px}
  .m .lab{color:var(--dim)} .m .val{font-weight:650;text-align:right}
  .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#2ea8e0,var(--acc))}
  .bar.hot i{background:linear-gradient(90deg,#e08a2e,var(--amber))}
  .bar.crit i{background:linear-gradient(90deg,#e04b4b,var(--red))}
  .foot{margin-top:15px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);
    display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--dim);font-size:12.5px}
  .exp{color:var(--amber)} .exp.ok{color:var(--dim)}
  footer{margin-top:26px;display:flex;justify-content:space-between;color:#5d6879;font-size:11.5px;letter-spacing:.14em}
  @media (max-width:900px){.overview{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.overview{grid-template-columns:1fr 1fr}.wrap{padding:20px 14px 36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><h1 id="siteName">我的舰队</h1><span>FLEET OVERVIEW · 实时状态</span></div>
    <div class="live"><span class="dot" id="liveDot"></span><span id="liveText">连接中…</span></div>
  </header>

  <section class="overview">
    <div class="ov glass"><div class="k">节点总数</div><span class="v" id="ovTotal">–</span><span class="s" id="ovRegions"></span></div>
    <div class="ov glass"><div class="k">在线率</div><span class="v" id="ovRate">–</span><span class="s">当前状态</span></div>
    <div class="ov glass"><div class="k">总流量</div><span class="v" id="ovTraf">–</span><span class="s" id="ovTrafSub"></span></div>
    <div class="ov glass"><div class="k">最近到期</div><span class="v" id="ovExp" style="font-size:20px">–</span><span class="s" id="ovExpSub"></span></div>
  </section>

  <main class="grid" id="grid"></main>

  <footer><div>POWERED BY KOMARI MONITOR</div><div>PRISM THEME · BY YZTUTU</div></footer>
</div>

<script>
const $=id=>document.getElementById(id);
const fmtB=b=>{if(b==null||isNaN(b))return"–";const u=["B","KB","MB","GB","TB","PB"];let i=0;b=+b;while(b>=1024&&i<u.length-1){b/=1024;i++}return b.toFixed(b>=100?0:1)+" "+u[i]};
const fmtUp=s=>{if(s==null)return"–";s=+s;const d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return d>0?`在线 ${d} 天`:h>0?`在线 ${h} 小时`:"在线 <1 小时"};
const pct=(u,t)=>t>0?Math.min(100,Math.round(u/t*100)):null;
const cls=p=>p==null?"":p>=90?"crit":p>=70?"hot":"";
const pick=(o,ks)=>{for(const k of ks){if(o&&o[k]!=null)return o[k]}return undefined};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ccOf=r=>{const m={"United States":"US","South Korea":"KR","Korea":"KR","Germany":"DE","Hong Kong":"HK","Malaysia":"MY","Japan":"JP","Singapore":"SG","United Kingdom":"GB","China":"CN","Taiwan":"TW","France":"FR","Netherlands":"NL","Canada":"CA","Australia":"AU"};return m[r]||(r?r.slice(0,2).toUpperCase():"··")};

let settings={refreshSeconds:10};
async function rpc(method,params){const r=await fetch("/api/rpc2",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",method,params:params||{},id:1})});const j=await r.json();if(j.error)throw new Error(j.error.message);return j.result}

const DEMO=[
 {name:"DMIT 洛杉矶",region:"United States",os:"Debian 12 · 4 核",cpu:12,mem:24,disk:31,up:3.1e6,down:4.9e6,uptime:864000,exp:"长期",tag:"CN2 精品",online:true},
 {name:"Oracle 春川",region:"South Korea",os:"Ubuntu 24.04 · 4 核",cpu:34,mem:40,disk:12,up:1.1e6,down:2.3e6,uptime:432000,exp:"免费",tag:"A1 大机",online:true},
 {name:"Netcup 德国",region:"Germany",os:"Debian 13 · 1 核",cpu:8,mem:41,disk:22,up:198e3,down:302e3,uptime:2592000,exp:"2027-02-04",tag:"监控中枢",online:true},
 {name:"WAWO 香港",region:"Hong Kong",os:"Debian 12 · 1 核",cpu:21,mem:44,disk:9,up:802e3,down:905e3,uptime:172800,exp:"2027-03-14",tag:"移动快线",online:true},
 {name:"青峰 马来西亚",region:"Malaysia",os:"Debian 12 · 2 核",cpu:5,mem:18,disk:15,up:640e3,down:720e3,uptime:1036800,exp:"长期",tag:"中转",online:true}
];

function normalize(nodesRaw,statusRaw){
  const nodes=Array.isArray(nodesRaw)?nodesRaw:(nodesRaw&&nodesRaw.nodes)||[];
  const st=statusRaw||{};
  return nodes.map(n=>{
    const s=st[n.uuid]||st[n.id]||{};
    const cpu=pick(s.cpu,["usage","percent"])??pick(s,["cpu_usage","cpu"]);
    const ramU=pick(s.ram,["used"])??pick(s,["mem_used","ram_used"]);
    const ramT=pick(s.ram,["total"])??n.mem_total??pick(s,["mem_total","ram_total"]);
    const dU=pick(s.disk,["used"])??pick(s,["disk_used"]); const dT=pick(s.disk,["total"])??n.disk_total??pick(s,["disk_total"]);
    const up=pick(s.network,["up","upload"])??pick(s,["net_up","up"]); const down=pick(s.network,["down","download"])??pick(s,["net_down","down"]);
    const tU=pick(s.network,["totalUp","total_up"])??0, tD=pick(s.network,["totalDown","total_down"])??0;
    return {name:n.name||n.uuid,region:n.region||n.country||"",os:[n.os,n.cpu_cores?n.cpu_cores+" 核":""].filter(Boolean).join(" · "),
      cpu:typeof cpu==="number"?Math.round(cpu):null,mem:pct(ramU,ramT),disk:pct(dU,dT),up,down,total:(+tU||0)+(+tD||0),
      uptime:pick(s,["uptime"]),exp:n.expired_at?String(n.expired_at).slice(0,10):"长期",tag:n.group||"",
      online:s.online!==false&&(s.online===true||cpu!==undefined||ramU!==undefined||up!==undefined)};
  });
}

function render(list){
  const on=list.filter(x=>x.online).length;
  $("ovTotal").textContent=list.length;
  const regs=[...new Set(list.map(x=>x.region).filter(Boolean))];
  $("ovRegions").textContent=regs.length?regs.length+" 个国家 / 地区":"";
  $("ovRate").textContent=list.length?Math.round(on/list.length*100)+"%":"–";
  $("ovTraf").textContent=fmtB(list.reduce((a,x)=>a+(x.total||0),0));
  $("ovTrafSub").textContent="累计";
  const dated=list.filter(x=>x.exp&&/^\d{4}-/.test(x.exp)).sort((a,b)=>a.exp<b.exp?-1:1)[0];
  if(dated){$("ovExp").textContent=dated.name;$("ovExpSub").textContent=dated.exp}else{$("ovExp").textContent="无";$("ovExpSub").textContent=""}
  $("liveDot").className="dot"+(on<list.length?" bad":"");
  $("liveText").textContent=`在线 ${on} / ${list.length} · 刚刚更新`;
  $("grid").innerHTML=list.map(x=>`
   <article class="card glass">
     <div class="top"><span class="cc">${ccOf(x.region)}</span><span class="name">${esc(x.name)}</span><span class="sdot ${x.online?"":"off"}"></span></div>
     <div class="row2"><span class="sub" style="margin-top:0">${esc(x.os||x.region||"")}</span>${x.tag?`<span class="tag">${esc(x.tag)}</span>`:""}</div>
     <div class="meters">
       ${[["CPU",x.cpu],["内存",x.mem],["磁盘",x.disk]].map(([l,v])=>`
       <div class="m"><span class="lab">${l}</span><span class="val">${v==null?"–":v+"%"}</span>
       <div class="bar ${cls(v)}"><i style="width:${v||0}%"></i></div></div>`).join("")}
     </div>
     <div class="foot"><span>↑ ${fmtB(x.up)}/s&nbsp;&nbsp;↓ ${fmtB(x.down)}/s</span><span>${fmtUp(x.uptime)}</span>
     <span class="exp ${/^\d{4}-/.test(x.exp||"")?"":"ok"}">到期 ${esc(x.exp||"—")}</span></div>
   </article>`).join("");
}

async function load(){
  try{
    const pub=await (await fetch("/api/public")).json();
    const ts=(pub&&pub.data&&pub.data.theme_settings)||{};
    if(ts.refreshSeconds)settings.refreshSeconds=+ts.refreshSeconds||10;
    if(pub&&pub.data&&pub.data.sitename)$("siteName").textContent=pub.data.sitename;
  }catch(e){}
  try{
    const nodes=await rpc("common:getNodes");
    const status=await rpc("common:getNodesLatestStatus");
    render(normalize(nodes,status&&(status.data||status)));
  }catch(e){ render(DEMO); $("liveText").textContent="演示数据 · 未连接后端"; }
}
load(); setInterval(load,(settings.refreshSeconds||10)*1000);
</script>
</body>
</html>
